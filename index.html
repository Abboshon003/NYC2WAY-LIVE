<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC2WAY Live</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="live-dot" id="liveDot" title="Live data"></span>
        <div>
          <h1>NYC2WAY Live</h1>
          <p id="statusText">Loading fleet...</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="fitFleetBtn" class="icon-btn" type="button" title="Fit fleet on map">⊕</button>
        <button id="darkModeBtn" class="icon-btn" type="button" title="Toggle dark mode">◑</button>
        <button id="refreshBtn" class="icon-btn" type="button" title="Refresh data">↺</button>
      </div>
    </header>

    <section class="controls">
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search car #, driver, destination..." autocomplete="off" />
        <button id="clearSearchBtn" type="button">Clear</button>
      </div>

      <div class="tabs">
        <button id="fleetTab" class="tab active" type="button">
          Fleet <span id="fleetCount" class="tab-badge">0</span>
        </button>
        <button id="allTab" class="tab" type="button">
          All Drivers <span id="allCount" class="tab-badge">0</span>
        </button>
      </div>
    </section>

    <main>
      <div id="map"></div>
    </main>

    <section id="bottomSheet" class="bottom-sheet" aria-live="polite">
      <div class="sheet-handle"></div>
      <button id="closeSheetBtn" class="close-btn" type="button" aria-label="Close">×</button>

      <div class="sheet-profile">
        <img id="sheetPhoto" class="driver-photo large" alt="Driver photo" />
        <div>
          <h2 id="sheetTitle">Driver</h2>
          <p id="sheetSubtitle">Car details</p>
        </div>
      </div>

      <div class="quick-grid">
        <div><span>Car</span><strong id="sheetCarNo">—</strong></div>
        <div><span>Company</span><strong id="sheetComp">—</strong></div>
        <div><span>Trip</span><strong id="sheetTrip">—</strong></div>
        <div><span>Status</span><strong id="sheetStatus">—</strong></div>
      </div>

      <p id="sheetDestination" class="destination">Destination unavailable</p>

      <div class="sheet-actions single">
        <button id="detailsBtn" type="button">View Full Details</button>
      </div>
    </section>

    <section id="detailsPage" class="details-page hidden">
      <div class="details-card">
        <button id="backBtn" class="back-btn" type="button">← Back to Map</button>

        <div class="details-header">
          <img id="detailsPhoto" class="driver-photo xlarge" alt="Driver photo" />
          <div>
            <h2 id="detailsTitle">Driver Details</h2>
            <p id="detailsSubtitle">NYC2WAY vehicle profile</p>
          </div>
        </div>

        <div id="detailsGrid" class="details-grid"></div>

        <h3>Raw Info</h3>
        <pre id="rawInfo"></pre>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
